spring.application.name=secure_s3
spring.mvc.apiversion.use.header=API-Version

server.port=${SS3_PORT}

spring.jpa.hibernate.ddl-auto=validate
pring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${SS3_DB_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${SS3_DB_MIN_IDLE}
spring.datasource.url=jdbc:${SS3_DB_URL}
spring.datasource.username=${SS3_DB_USERNAME}
spring.datasource.password=${SS3_DB_PASSWORD}

secure_s3.session.ttl=${SS3_SESSION_TTL_MINUTES}
secure_s3.validate.file.min-size=${SS3_MIN_FILE_SIZE_BYTES}
secure_s3.validate.file.max-size=${SS3_MAX_FILE_SIZE_BYTES}
secure_s3.validate.file.extensions=${SS3_FILE_EXTENSIONS}
secure_s3.file.chunk.max-size=${SS3_CHUNK_MAX_SIZE_BYTES}

secure_s3.openbao.url=${SS3_OPENBAO_URL}
secure_s3.openbao.token=${SS3_OPENBAO_ROOT_TOOKEN}
secure_s3.openbao.kek-name=${SS3_OPENBAO_KEK_NAME}

secure_s3.rustfs.url=${SS3_RUSTFS_URL}
secure_s3.rustfs.access-key=${SS3_RUSTFS_ACCESS_KEY}
secure_s3.rustfs.secret-key=${SS3_RUSTFS_SECRET_KEY}
secure_s3.rustfs.bucket-name=${SS3_RUSTFS_BUCKET_NAME}
secure_s3.rustfs.region=${SS3_RUSTFS_REGION}
